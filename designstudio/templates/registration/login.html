{% extends "base_generic.html" %}

{% block content %}

  <div class="auth-container">
    <h2 class="auth-title">Вход в аккаунт</h2>

    {% if form.errors %}
      <div class="alert alert-error">
        Неверное имя пользователя или пароль.
      </div>
    {% endif %}

    <form method="post" class="auth-form">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Логин</label>
        {{ form.username }}
      </div>

      <div class="form-group">
        <label class="form-label">Пароль</label>
        {{ form.password }}
      </div>

      <button type="submit" class="btn-submit">Войти</button>
<!--      <input type="hidden" name="next" value="{{ next }}">-->
    </form>

<!--    <p class="auth-footer-link" style="text-align: center; margin-top: 20px;">-->
<!--      <a href="{% url 'password_reset' %}">Забыли пароль?</a>-->
<!--    </p>-->
    <p class="auth-footer-link" style="text-align: center;">
      Нет аккаунта? <a href="{% url 'registration' %}">Зарегистрироваться</a>
    </p>
  </div>

{% endblock %}
